name: WindSpigot Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip]')"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 18.0.1
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '18.0.1'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package --file pom.xml

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.ref_name }}"
        echo "Creating release for $TAG..."

        # Clean up any partially created release for this tag
        gh release delete "$TAG" --yes 2>/dev/null || true

        read -r -d '' NOTES << 'EOF' || true
        ## This update fixes:
        * **Explosion & Fireball Knockback**: Fixed inverted fireball knockback and incorrect explosion radius calculations by dynamically scaling to `f3 * f3` instead of hardcoding `64.0D`.
        * **Outbound Packet Flushing**: Fixed outbound velocity and knockback packets being delayed or dropped by ensuring `NetworkManager.flush()` submits to the Netty event loop from non-I/O threads.
        * **World Ticking & Memory Leaks**: Fixed memory leaks and stale world retention when loading and unloading dynamic worlds in `WorldTickManager`.
        * **Async Entity Tracking Deadlock**: Fixed potential server freezes by enclosing tracker latch countdowns in `try-finally` blocks.
        * **Entity Visibility Lag**: Removed the 5-second tracking delay (`disableTracking=100`) and restored responsive add/remove rates.
        * **Mob Spawning & Mob Caps**: Fixed inverted boolean condition for spectators and restored active chunk-based mob counting in `SpawnerCreature`.
        * **Block Placement Validation**: Fixed server crashes and exploits from malformed block placement packets with null directions or negative Y.
        * **TCPShield / Handshake Compatibility**: Fixed `NullPointerException` when proxy listeners leave optional fields null in `PlayerHandshakeEvent`.
        * **Process Queue Exception Safety**: Fixed server tick loop halts in `MinecraftServer.processQueue` while preserving JVM `Error` propagation.
        * **Async Pathfinding Recovery**: Fixed frozen mob AI when pathfinding tasks are rejected by ensuring `isSearching` is always reset in `SearchHandler`.
        * **Async Combat Thread Safety**: Fixed `NullPointerException` races in `CombatThread` and eliminated cross-player packet mixing in `Spigot404Write`.
        * **Lag Compensator Data Race**: Fixed multi-threaded race conditions between Netty I/O threads and the main server thread in `LagCompensator`.
        * **Player Spatial Map Crash**: Fixed `NullPointerException` in `PlayerMap.move()` during player teleportation or early joins.
        * **Java 9-25 Compatibility**: Fixed reflection crashes in `CustomTimingsHandler` when running on modern Java versions (11, 17, 21, 25).
        * **Shutdown Safety**: Fixed premature event loop termination and NPEs during server shutdown in `ServerConnection`.

        ## This update adds:
        * **Spatial Hash PlayerMap**: Replaced linear `Long2ObjectArrayMap` with O(1) `Long2ObjectOpenHashMap` for fast spatial entity lookups.
        * **Zero-Allocation Concurrent Map**: Replaced lambda allocations in `ConcurrentIntHashMap` with direct synchronized methods.
        * **Thread-Safe Explosion Density Cache**: Synchronized fastutil map caching for concurrent multi-threaded TNT density raytracing.
        * **Thread-Safe Lazy Initialization**: Added double-checked locking to `LazyInitVar` to prevent duplicate Netty event loop group allocations.
        * **Comprehensive Test Suite**: Added 14 unit and concurrency regression test suites covering combat, spawning, networking, and spatial indexing.

        Special thanks to **GamingOP69** for all the core audits, concurrency fixes, and optimizations!
        EOF

        SUCCESS=0
        for i in 1 2 3 4 5; do
          echo "Release creation attempt $i/5..."
          if gh release create "$TAG" \
              WindSpigot-Server/target/WindSpigot.jar \
              WindSpigot-API/target/WindSpigot-API.jar \
              --title "WindSpigot $TAG" \
              --notes "$NOTES"; then
            SUCCESS=1
            echo "Release $TAG published successfully!"
            break
          fi

          WAIT=$((i * 5))
          echo "Attempt $i failed. Retrying in ${WAIT} seconds..."
          sleep $WAIT
        done

        if [ $SUCCESS -eq 0 ]; then
          echo "Failed to create release after 5 attempts."
          exit 1
        fi
