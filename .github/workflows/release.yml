name: WindSpigot Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip]')"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 18.0.1
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '18.0.1'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package --file pom.xml

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.ref_name }}"
        echo "Creating release for $TAG..."

        # Delete any pre-existing release for this tag if left in inconsistent state
        gh release delete "$TAG" -y 2>/dev/null || true

        SUCCESS=0
        for i in 1 2 3 4 5; do
          echo "Release creation attempt $i/5..."
          if [ -f RELEASE_NOTES.md ]; then
            if gh release create "$TAG" \
                WindSpigot-Server/target/WindSpigot.jar \
                WindSpigot-API/target/WindSpigot-API.jar \
                --title "WindSpigot $TAG" \
                --notes-file RELEASE_NOTES.md \
                --clobber; then
              SUCCESS=1
              echo "Release $TAG published successfully!"
              break
            fi
          else
            if gh release create "$TAG" \
                WindSpigot-Server/target/WindSpigot.jar \
                WindSpigot-API/target/WindSpigot-API.jar \
                --title "WindSpigot $TAG" \
                --generate-notes \
                --clobber; then
              SUCCESS=1
              echo "Release $TAG published successfully!"
              break
            fi
          fi
          echo "Attempt $i failed. Retrying in $((i * 4)) seconds..."
          sleep $((i * 4))
        done

        if [ $SUCCESS -eq 0 ]; then
          echo "Failed to create release after 5 attempts."
          exit 1
        fi
